<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>상품 목록 | endpointproject</title>
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    /* 가로 한 줄 정렬 스타일 */
    .search-filter-box {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 20px 0;
      width: 100%;
    }
    .search-filter-box select {
      width: 140px;
      height: 42px;
      flex-shrink: 0;
    }
    .search-filter-box input {
      flex: 1;
      height: 42px;
    }
    .search-filter-box button {
      height: 42px;
      padding: 0 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 상품 카드 그리드 */
    #product-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .product-card {
      border: 1px solid var(--color-border, #ddd);
      border-radius: var(--radius-md, 8px);
      padding: 18px;
      background: var(--color-surface-alt, #fff);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-soft, 0 4px 12px rgba(0,0,0,0.08));
    }
    .category-tag {
      display: inline-block;
      align-self: flex-start;
      font-size: 12px;
      background: var(--color-tertiary, #e3f2fd);
      color: var(--color-neutral, #526d82);
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .product-title {
      font-size: 16px;
      margin: 10px 0 6px 0;
      word-break: keep-all;
    }
    .price {
      font-size: 16px;
      font-weight: bold;
      color: var(--color-danger, #e63946);
      margin: 4px 0;
    }
    .stock {
      font-size: 13px;
      color: var(--color-text-secondary, #666);
    }
    .status-msg {
      text-align: center;
      padding: 30px;
      font-size: 15px;
      color: var(--color-text-secondary, #666);
    }
  </style>
</head>
<body>
  <!-- 팀 공통 네비게이션 -->
  <header>
    <nav>
      <a href="./index.html">홈</a>
      <a id="nav-signup-link" href="./signup.html">회원가입</a>
      <a id="nav-login-link" href="./login.html">로그인</a>
      <a id="nav-mypage-link" href="./mypage.html">내 정보</a>
      <button id="nav-logout-btn" type="button">로그아웃</button>
    </nav>
  </header>

  <main style="max-width: 1000px; margin: 0 auto; padding: 20px;">
    <h1>🛍️ 상품 목록</h1>
    <p>메인 페이지입니다.</p>

    <!-- 검색 및 카테고리 필터 영역 -->
    <section class="search-filter-box">
      <select id="category-select" class="input">
        <option value="">전체 카테고리</option>
        <option value="전자기기">전자기기</option>
        <option value="뷰티/화장품">뷰티/화장품</option>
        <option value="도서/음반">도서/음반</option>
        <option value="생활/주방">생활/주방</option>
        <option value="패션/의류">패션/의류</option>
      </select>
      <input type="text" id="search-keyword" class="input" placeholder="상품명을 입력하세요" />
      <button id="search-btn" class="btn btn-primary">검색</button>
    </section>

    <!-- 로딩 및 안내 메시지 -->
    <div id="status-message" class="status-msg"></div>

    <!-- 상품 카드 리스트 -->
    <section id="product-container"></section>
  </main>

  <script src="./js/commom.js"></script>
  <script src="./js/product.js"></script>
</body>
</html>
