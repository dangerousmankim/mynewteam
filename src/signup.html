<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="form-container">
      <h2 style="text-align: center; margin-bottom: 20px;">📝 회원가입</h2>
      
      <form id="signup-form">
        <div class="input-group">
          <label for="signup-email">이메일</label>
          <input type="email" id="signup-email" required placeholder="example@email.com">
        </div>
        <div class="input-group">
          <label for="signup-password">비밀번호</label>
          <input type="password" id="signup-password" required placeholder="비밀번호를 입력하세요">
        </div>
        <div class="input-group">
          <label for="signup-name">이름</label>
          <input type="text" id="signup-name" required placeholder="홍길동">
        </div>
        <div class="input-group">
          <label for="signup-address">주소</label>
          <input type="text" id="signup-address" required placeholder="서울시 강남구 테헤란로...">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">가입하기</button>
      </form>

      <div id="signup-msg" class="status-msg" style="padding: 15px 0;"></div>
      <p style="text-align: center; font-size: 13px;">이미 계정이 있으신가요? <a href="login.html" style="color: #007bff;">로그인</a></p>
    </div>
  </div>

  <script src="js/commom.js"></script>
  <script>
    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const userData = {
        email: document.getElementById("signup-email").value,
        password: document.getElementById("signup-password").value,
        name: document.getElementById("signup-name").value,
        address: document.getElementById("signup-address").value
      };
      await handleSignup(userData);
    });
  </script>
</body>
</html>
