<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="form-container">
      <h2 style="text-align: center; margin-bottom: 20px;">🔐 로그인</h2>
      
      <form id="login-form">
        <div class="input-group">
          <label for="login-email">이메일</label>
          <input type="email" id="login-email" required placeholder="example@email.com">
        </div>
        <div class="input-group">
          <label for="login-password">비밀번호</label>
          <input type="password" id="login-password" required placeholder="비밀번호를 입력하세요">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">로그인</button>
      </form>

      <div id="login-msg" class="status-msg" style="padding: 15px 0;"></div>
      <p style="text-align: center; font-size: 13px;">계정이 없으신가요? <a href="signup.html" style="color: #007bff;">회원가입</a></p>
    </div>
  </div>

  <script src="js/commom.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      await handleLogin(email, password);
    });
  </script>
</body>
</html>
