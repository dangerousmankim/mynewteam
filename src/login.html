<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>로그인 | endpointproject</title>
</head>
<body>
  <header>
    <nav>
      <a href="./index.html">홈</a>
      <a id="nav-signup-link" href="./signup.html">회원가입</a>
      <a id="nav-login-link" href="./login.html">로그인</a>
      <a id="nav-mypage-link" href="./mypage.html">내 정보</a>
      <button id="nav-logout-btn" type="button">로그아웃</button>
    </nav>
  </header>

  <main>
    <h1>로그인</h1>
    <form id="login-form">
      <div>
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div>
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit">로그인</button>
    </form>
    <p id="login-message" role="status"></p>
  </main>

  <script src="./js/commom.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
