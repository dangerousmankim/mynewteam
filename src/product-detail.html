<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>상품 상세 | endpointproject</title>
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      .detail-wrap {
        max-width: 700px;
        margin: 20px auto;
        padding: 30px;
      }
      .status-msg {
        text-align: center;
        padding: 30px;
        font-size: 15px;
        color: var(--color-text-secondary, #666);
      }
      .category-tag {
        display: inline-block;
        font-size: 13px;
        background: var(--color-tertiary, #e3f2fd);
        color: var(--color-neutral, #526d82);
        padding: 4px 10px;
        border-radius: 4px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <!-- 팀 공통 네비게이션 -->
    <header>
      <nav>
        <a href="./index.html">홈</a>
        <a id="nav-signup-link" href="./signup.html">회원가입</a>
        <a id="nav-login-link" href="./login.html">로그인</a>
        <a id="nav-mypage-link" href="./mypage.html">내 정보</a>
        <button id="nav-logout-btn" type="button">로그아웃</button>
      </nav>
    </header>

    <main style="max-width: 1000px; margin: 0 auto; padding: 20px">
      <button onclick="location.href = './index.html'" class="btn btn-outlined">
        ← 목록으로
      </button>

      <!-- 팀장님 ID 매칭: detail-loading -->
      <div id="detail-loading" class="status-msg">
        상품 정보를 불러오는 중...
      </div>

      <!-- 팀장님 ID 매칭: detail-card 및 하위 정보 id -->
      <article id="detail-card" class="card detail-wrap" style="display: none">
        <div>
          <span id="detail-category" class="category-tag"></span>
          <h1 id="detail-name" style="margin: 12px 0 6px 0"></h1>
        </div>

        <hr
          style="
            margin: 15px 0;
            border: 0;
            border-top: 1px solid var(--color-border, #eee);
          "
        />

        <p
          style="
            font-size: 22px;
            font-weight: bold;
            color: var(--color-danger, #e63946);
            margin-bottom: 8px;
          "
        >
          가격: <span id="detail-price"></span>원
        </p>
        <p
          style="margin-bottom: 20px; color: var(--color-text-secondary, #666)"
        >
          남은 재고: <span id="detail-stock" style="font-weight: bold"></span>개
        </p>

        <div
          style="
            padding: 20px;
            background: var(--color-surface, #f8f9fa);
            border-radius: var(--radius-md, 8px);
          "
        >
          <h3 style="margin-bottom: 10px">상품 설명</h3>
          <p
            id="detail-desc"
            style="white-space: pre-line; line-height: 1.6"
          ></p>
        </div>
      </article>
    </main>

    <script src="./js/commom.js"></script>
    <script src="./js/product.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 팀장님이 만든 상세 조회 함수 호출
        loadProductDetail();
      });
    </script>
  </body>
</html>
