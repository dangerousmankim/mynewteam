<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 상세 정보</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <h2 class="logo" onclick="location.href='index.html'">Endpoint Mall</h2>
      <nav id="auth-nav">
        <button id="auth-btn" class="btn btn-outline">로그인</button>
        <button id="signup-nav-btn" class="btn btn-outline" onclick="location.href='signup.html'">회원가입</button>
        <button id="mypage-btn" class="btn btn-primary" style="display: none;" onclick="location.href='mypage.html'">내 정보</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <button onclick="location.href='index.html'" class="btn btn-secondary" style="margin-bottom: 20px;">← 목록으로 돌아가기</button>

    <div id="detail-loading" class="status-msg">상품 정보를 불러오는 중...</div>

    <div id="detail-card" class="detail-container" style="display: none;">
      <span class="category-tag" id="detail-category"></span>
      <h1 id="detail-name" style="margin: 10px 0;"></h1>
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
      
      <p class="price" style="font-size: 24px; margin-bottom: 10px;">
        가격: <span id="detail-price"></span>원
      </p>
      <p class="stock" style="font-size: 15px; margin-bottom: 20px;">
        남은 재고: <span id="detail-stock"></span>개
      </p>
      
      <div style="background: #fdfdfd; padding: 20px; border-radius: 6px; border: 1px solid #f0f0f0;">
        <h3 style="margin-bottom: 10px;">상품 설명</h3>
        <p id="detail-desc" style="line-height: 1.6; white-space: pre-line;"></p>
      </div>
    </div>
  </main>

  <script src="js/commom.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initAuthNav();
      loadProductDetail();
    });
  </script>
</body>
</html>
